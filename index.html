<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Handyman - Business Records</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-target, #print-target * { visibility: visible; }
            #print-target { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

    <!-- Main Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="border-b border-gray-200">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button onclick="switchTab('invoice')" id="tab-btn-invoice" class="border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Invoicing Generator</button>
                <button onclick="switchTab('income')" id="tab-btn-income" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Manual Income</button>
            </nav>
        </div>
    </div>

    <!-- MAIN CONTENT FRAMEWORK -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- TAB 1: INVOICING GENERATOR -->
        <section id="tab-invoice" class="block">
            <div class="bg-white rounded-xl shadow p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-slate-800">Create Invoice</h2>
                
                <!-- AUTOMATED INVOICE NUMBER DISPLAY BADGE -->
                <div style="margin-bottom: 15px; padding: 10px; background-color: #f0f4f8; border-left: 4px solid #1e3a8a; border-radius: 4px;">
                    <span style="font-weight: bold; color: #1e3a8a;">Next Automatic Invoice Number: </span>
                    <span id="nextInvoiceNumberDisplay" style="font-weight: bold; color: #d97706;">Generating...</span>
                </div>

                <!-- Simple Mock Entry Form Elements -->
                <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Client Name</label>
                        <input type="text" id="clientName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Total Amount ($)</label>
                        <input type="number" id="invoiceAmount" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="0.00">
                    </div>
                </div>
                <button onclick="simulateCreateInvoice()" class="mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Create Invoice</button>
            </div>

            <!-- SAVED INVOICES LOG GRID LIST TABLE -->
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-slate-800">Saved Invoices History</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Invoice No</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Dynamic Rows Inject Right Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 2: MANUAL INCOME -->
        <section id="tab-income" class="hidden">
            <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-xl font-semibold mb-4 text-slate-800">Log Cash / External Payment</h2>
                <p class="text-sm text-slate-500">Manual income tracking form.</p>
            </div>
        </section>
    </main>

    <!-- PRINT VIEW HIDDEN CONTAINER -->
    <div id="print-target" class="hidden p-8 bg-white text-black">
        <h2 style="margin:0;font-size:20px;color:#d97706;">INVOICE</h2>
        <p style="margin:4px 0;font-size:12px;" id="printDate"></p>
        <p style="margin:4px 0;font-size:12px;font-weight:bold;color:#1e3a8a;" id="printInvoiceId">Invoice No: JH-2026-001</p>
        <p style="margin:4px 0;font-size:12px;" id="printStatus"></p>
    </div>

    <!-- WEB DATA APPLICATION SCRIPT EXECUTION ENGINE -->
    <script>
        // Secure Application Global Variable Application Memory States
        window.state = {
            invoices: [
                { id: "inv_1", created_at: "2026-08-20T10:00:00Z", client: "Dave Henderson", total: 450.00, status: "Paid" },
                { id: "inv_2", created_at: "2026-08-22T14:30:00Z", client: "Sarah Jenkins", total: 120.00, status: "Pending" }
            ]
        };

        function switchTab(tabName) {
            document.getElementById('tab-invoice').className = tabName === 'invoice' ? 'block' : 'hidden';
            document.getElementById('tab-income').className = tabName === 'income' ? 'block' : 'hidden';
        }

        // Automatic Invoice Sequence Engine Calculation
        function updateInvoiceSequentialNumbers() {
            const currentYear = new Date().getFullYear();
            const prefix = `JH-${currentYear}-`;
            
            // 1. Update the Invoice Form Badge Container Element View Card
            const nextDisplay = document.getElementById('nextInvoiceNumberDisplay');
            if (nextDisplay && window.state && window.state.invoices) {
                const nextNum = window.state.invoices.length + 1;
                nextDisplay.innerText = `${prefix}${String(nextNum).padStart(3, '0')}`;
            }
            
            // 2. Clear and Render Table Rows with Dynamic Numbering Anchors
            const tbody = document.getElementById('invoiceTableBody');
            if (tbody && window.state && window.state.invoices) {
                tbody.innerHTML = '';
                
                // Sort chronologically so oldest entry gets 001
                const sorted = [...window.state.invoices].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                
                sorted.forEach((inv, index) => {
                    const sequenceNum = `${prefix}${String(index + 1).padStart(3, '0')}`;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-900">${sequenceNum}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(inv.created_at).toLocaleDateString('en-AU')}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${inv.client}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${inv.total.toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">${inv.status}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        function simulateCreateInvoice() {
            const name = document.getElementById('clientName').value || "New Client";
            const amt = parseFloat(document.getElementById('invoiceAmount').value) || 0.00;
            window.state.invoices.push({
                id: "inv_" + Date.now(),
                created_at: new Date().toISOString(),
                client: name,
                total: amt,
                status: "Pending"
            });
            updateInvoiceSequentialNumbers();
        }

        // Initialize display configuration on launch load loop
        updateInvoiceSequentialNumbers();
    </script>
</body>
</html>
